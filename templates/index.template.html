<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <script>
      (function () {
        document.documentElement.dataset.theme = "dark";
      })();
    </script>
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body class="swiss-page page-home">
    {{GRID_TOGGLE}}
    <div class="site-shell swiss-wrap">
      <div class="grid-guides" aria-hidden="true">{{GRID_COLUMNS}}</div>
      <main>
        <section class="about-teaser" aria-labelledby="about-teaser-title">
          <div class="about-teaser__inner">
            <h2 id="about-teaser-title" class="about-teaser__title">
              <span class="about-teaser__name"><span class="about-teaser__name-prefix">I'm</span> <span class="about-teaser__name-value">{{PERSON_NAME}}.</span></span>
              <span class="about-teaser__role">Digital Product Designer</span>
            </h2>
            <div class="about-teaser__description">
              {{PROFILE_DESCRIPTION}}
            </div>
            <section class="about-teaser__career" aria-labelledby="home-career-title">
              <h3 id="home-career-title" class="about-teaser__career-title">Work Experience</h3>
              <div class="career-list">
                {{CAREER_ITEMS}}
              </div>
            </section>
          </div>
        </section>
        <div class="home-work-column">
          <div class="project-sections" id="works">
            {{PROJECT_SECTIONS}}
          </div>
        </div>
      </main>

    </div>
  </body>
</html>
