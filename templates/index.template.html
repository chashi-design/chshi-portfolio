<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/assets/img/favicon.png" type="image/png" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body class="swiss-page page-home">
    <div class="site-shell swiss-wrap">
      <main>
        <section class="about-teaser" id="about" aria-labelledby="about-teaser-title">
          <div class="about-teaser__inner">
            <h2 id="about-teaser-title" class="about-teaser__title">
              <span class="about-teaser__name"><span class="about-teaser__name-prefix">Hello, I'm</span> <span class="about-teaser__name-value">{{PERSON_NAME_MARKUP}}.</span></span>
            </h2>
            <div class="about-teaser__description">
              {{PROFILE_DESCRIPTION}}
            </div>
            <section class="about-teaser__career" aria-labelledby="home-career-title">
              <h3 id="home-career-title" class="about-teaser__career-title">Work Experience</h3>
              <div class="career-list">
                {{CAREER_ITEMS}}
              </div>
            </section>
          </div>
        </section>
        <div class="home-work-column">
          <section class="home-selected-work" id="works" aria-labelledby="home-selected-work-title">
            <h3 id="home-selected-work-title" class="home-selected-work__title">Selected Work</h3>
            <div class="project-sections">
              {{PROJECT_SECTIONS}}
            </div>
          </section>
          <section class="home-speaking" id="speaking" aria-labelledby="home-speaking-title">
            <h3 id="home-speaking-title" class="home-speaking__heading">Speak</h3>
            <div class="home-speaking__list bento-grid">
              {{SPEAKING_LINKS}}
            </div>
          </section>
        </div>
      </main>

    </div>
    <nav class="home-segmented-control" aria-label="Home section navigation">
      <div class="home-segmented-control__inner">
        <a class="home-segmented-control__logo" href="#about">chashi.</a>
        <div class="home-segmented-control__items">
          <button class="home-segmented-control__button" type="button" data-home-segment-target="#about">About</button>
          <button class="home-segmented-control__button" type="button" data-home-segment-target="#works">Work</button>
          <button class="home-segmented-control__button" type="button" data-home-segment-target="#speaking">Speak</button>
        </div>
      </div>
    </nav>
  </body>
</html>
