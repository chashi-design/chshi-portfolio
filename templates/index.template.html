<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body class="swiss-page page-home">
    <div class="site-header-shell">
      <header class="site-header">
        <a class="site-header__link site-header__home" href="{{HOME_URL}}">Home</a>
        <nav class="site-header__nav" aria-label="Primary">
          <a class="site-header__link" href="{{WORK_URL}}">Work</a>
          <a class="site-header__link" href="{{PROFILE_URL}}">About</a>
        </nav>
      </header>
    </div>
    {{GRID_TOGGLE}}
    <div class="site-shell swiss-wrap">
      <div class="grid-guides" aria-hidden="true">{{GRID_COLUMNS}}</div>
      <aside class="side-nav" aria-label="Page navigation">
        <nav class="side-nav__links" aria-label="Primary">
          <a class="side-nav__link" href="{{HOME_URL}}">Home</a>
          <a class="side-nav__link" href="{{WORK_URL}}">Work</a>
          <a class="side-nav__link" href="{{PROFILE_URL}}">About</a>
        </nav>
      </aside>

      <main>
        <section class="swiss-masthead swiss-band" aria-labelledby="home-title">
          <div class="swiss-masthead__identity">
            <h1 class="masthead-title" id="home-title">{{PERSON_NAME}}</h1>
            {{PERSON_SUBNAME}}
          </div>
          <div class="swiss-masthead__copy">
            <p class="swiss-lead">{{SITE_DESCRIPTION}}</p>
            <ul class="swiss-lead-list">
              {{SITE_LEAD_BULLETS}}
            </ul>
          </div>
          <figure class="swiss-profile">
            <img src="{{PROFILE_IMAGE}}" alt="{{PERSON_NAME}}" loading="eager" decoding="async" />
          </figure>
        </section>

        <section class="sns-links" aria-label="SNS links">
          <div class="sns-grid">
            {{SNS_CARDS}}
          </div>
        </section>

        <div class="project-sections" id="works">
          {{PROJECT_SECTIONS}}
        </div>
        {{MORE_WORKS_SECTION}}
      </main>

      <footer class="site-footer">
        <p>Built with static HTML/CSS/JS and Node build script.</p>
      </footer>
    </div>
  </body>
</html>
