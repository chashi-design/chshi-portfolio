<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <div class="site-header-shell">
      <header class="site-header">
        <a class="site-header__link site-header__home" href="{{HOME_URL}}">Home</a>
        <nav class="site-header__nav" aria-label="Primary">
          <a class="site-header__link" href="{{WORK_URL}}">Work</a>
          <a class="site-header__link" href="{{PROFILE_URL}}">About</a>
          <button class="theme-toggle site-header__theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え">
            <span data-theme-icon aria-hidden="true">☾</span>
          </button>
        </nav>
      </header>
    </div>
    <div class="site-shell">
      <header class="masthead" id="profile">
        <div class="masthead-profile">
          <img
            class="profile-avatar"
            src="{{PROFILE_IMAGE}}"
            alt="{{PERSON_NAME}} profile image"
            width="180"
            height="180"
            loading="eager"
            decoding="async"
          />
          <h1>{{PERSON_NAME}}</h1>
          {{PERSON_SUBNAME}}
          <ul class="lead-list">
            {{SITE_LEAD_BULLETS}}
          </ul>
        </div>
      </header>

      <main>
        <section class="sns-links" aria-label="SNS links">
          <div class="sns-grid">
            {{SNS_CARDS}}
          </div>
        </section>

        <div class="project-sections" id="works">
          {{PROJECT_SECTIONS}}
        </div>
        {{MORE_WORKS_SECTION}}
      </main>

      <footer class="site-footer">
        <p>Built with static HTML/CSS/JS and Node build script.</p>
      </footer>
    </div>
  </body>
</html>
