<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <div class="site-header-shell">
      <header class="site-header">
        <a class="site-header__link site-header__home" href="{{HOME_URL}}">Home</a>
        <nav class="site-header__nav" aria-label="Primary">
          <a class="site-header__link" href="{{WORK_URL}}">Work</a>
          <a class="site-header__link" href="{{PROFILE_URL}}">About</a>
        </nav>
      </header>
    </div>
    <div class="site-shell site-shell--project">
      <aside class="side-nav" aria-label="Page navigation">
        <nav class="side-nav__links" aria-label="Primary">
          <a class="side-nav__link" href="{{HOME_URL}}">Home</a>
          <a class="side-nav__link" href="{{WORK_URL}}">Work</a>
          <a class="side-nav__link" href="{{PROFILE_URL}}">About</a>
        </nav>
      </aside>

      <main class="project-layout projects-index-layout">
        <section class="card projects-index-intro">
          <p class="eyebrow">All Works</p>
          <h1>{{LIST_TITLE}}</h1>
          <p class="lead">{{LIST_DESCRIPTION}}</p>
        </section>

        <div class="project-sections">
          {{PROJECT_SECTIONS}}
        </div>
      </main>

      <footer class="site-footer">
        <p>Built with static HTML/CSS/JS and Node build script.</p>
      </footer>
    </div>
  </body>
</html>
