<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <script>
      (function () {
        document.documentElement.dataset.theme = "dark";
      })();
    </script>
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body class="swiss-page page-profile">
    <div class="site-header-shell">
      <header class="site-header">
        <a class="site-header__link site-header__home" href="{{HOME_URL}}">Home</a>
        <nav class="site-header__nav" aria-label="Primary">
          <label class="theme-switcher">
            <select class="theme-switcher__select" data-theme-select aria-label="Color theme">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </nav>
      </header>
    </div>
    {{GRID_TOGGLE}}
    <div class="site-shell site-shell--project swiss-wrap">
      <div class="grid-guides" aria-hidden="true">{{GRID_COLUMNS}}</div>
      <aside class="side-nav" aria-label="Page navigation">
        <nav class="side-nav__links" aria-label="Primary">
          <a class="side-nav__link" href="{{HOME_URL}}">Home</a>
          <label class="theme-switcher theme-switcher--side">
            <select class="theme-switcher__select" data-theme-select aria-label="Color theme">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </nav>
      </aside>

      <main class="profile-layout">
        <section class="profile-section" aria-labelledby="about-title">
          <div class="profile-section__body">
            <h1 id="about-title" class="profile-page-title">About Me</h1>
          </div>
        </section>

        <section class="profile-section" aria-labelledby="profile-name">
          <div class="profile-section__body">
            <img
              class="profile-avatar"
              src="{{PROFILE_IMAGE}}"
              alt="{{PERSON_NAME}} profile image"
              width="170"
              height="170"
              loading="eager"
              decoding="async"
            />
            <h2 id="profile-name" class="profile-section__title">{{PERSON_NAME}}</h2>
            {{PERSON_SUBNAME}}
            <div class="profile-description">
              {{PROFILE_DESCRIPTION}}
            </div>
          </div>
        </section>

        <section class="profile-section" aria-labelledby="career-title">
          <h2 id="career-title" class="profile-section__title">キャリア</h2>
          <div class="career-list">
            {{CAREER_ITEMS}}
          </div>
        </section>

        <section class="profile-section" aria-labelledby="likes-title">
          <h2 id="likes-title" class="profile-section__title">ライク</h2>
          {{PROFILE_LIKES}}
        </section>

        <section class="profile-section" aria-labelledby="sns-title">
          <h2 id="sns-title" class="profile-section__title">SNS</h2>
          <div class="sns-links profile-sns-links" aria-label="SNS links">
            <div class="sns-grid">
              {{PROFILE_SNS_CARDS}}
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
