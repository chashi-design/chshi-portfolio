<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/assets/img/favicon.png" type="image/png" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css?v={{ASSET_VERSION}}" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body class="swiss-page page-detail">
    <div class="site-shell site-shell--project swiss-wrap">
      <main class="project-layout project-layout--detail">
        <section class="card detail-module" aria-labelledby="detail-module-title">
          <h1 id="detail-module-title" class="detail-module__title">{{PROJECT_TITLE}}</h1>
          <dl class="detail-module__list">
            <div class="detail-module__row detail-module__row--meta">
              <div class="detail-module__meta-item">
                <dt>Role</dt>
                <dd>{{PROJECT_ROLE}}</dd>
              </div>
              <div class="detail-module__meta-item">
                <dt>Date</dt>
                <dd>{{PROJECT_DATE}}</dd>
              </div>
              <div class="detail-module__meta-item">
                <dt>Platform</dt>
                <dd>{{PROJECT_PLATFORM}}</dd>
              </div>
{{PROJECT_COMPANY_ROW}}
            </div>
          </dl>
        </section>

        <section class="card project-main">
          <figure class="project-main-media">
            {{HERO_IMAGE_MARKUP}}
          </figure>
        </section>

        <section class="description-section" aria-label="Project detail sections">
          <div class="description-flow">
            {{DESCRIPTION_SECTIONS}}
          </div>
        </section>
      </main>
      <nav class="home-segmented-control project-floating-nav" aria-label="Project navigation">
        <div class="home-segmented-control__inner">
          <a class="home-segmented-control__logo" href="{{HOME_URL}}">chashi.</a>
          {{PROJECT_NAV}}
        </div>
      </nav>
    </div>
  </body>
</html>
