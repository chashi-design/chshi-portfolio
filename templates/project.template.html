<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="stylesheet" href="{{ASSET_PREFIX}}/assets/styles.css" />
    <script defer src="{{ASSET_PREFIX}}/assets/app.js"></script>
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <div class="site-header-shell">
      <header class="site-header">
        <a class="site-header__home" href="{{HOME_URL}}">Home</a>
        <nav class="site-header__nav" aria-label="Primary">
          <a href="{{WORK_URL}}">Work</a>
          <a href="{{PROFILE_URL}}">About</a>
          <button class="theme-toggle site-header__theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え">
            <span data-theme-icon aria-hidden="true">☾</span>
          </button>
        </nav>
      </header>
    </div>
    <div class="site-shell site-shell--project">
      <main class="project-layout project-layout--detail">
        <section class="card project-main">
          <figure class="project-main-media">
            <img src="{{HERO_IMAGE}}" alt="{{HERO_ALT}}" loading="eager" decoding="async" />
          </figure>
        </section>

        <section class="card detail-module" aria-labelledby="detail-module-title">
          <h1 id="detail-module-title" class="detail-module__title">{{PROJECT_SUBTITLE}}</h1>
          <dl class="detail-module__list">
            <div class="detail-module__row detail-module__row--meta">
              <div class="detail-module__meta-item">
                <dt>Service</dt>
                <dd>{{PROJECT_SERVICE}}</dd>
              </div>
              <div class="detail-module__meta-item">
                <dt>Role</dt>
                <dd>{{PROJECT_ROLE}}</dd>
              </div>
              <div class="detail-module__meta-item">
                <dt>Date</dt>
                <dd>{{PROJECT_DATE}}</dd>
              </div>
              <div class="detail-module__meta-item">
                <dt>Platform</dt>
                <dd>{{PROJECT_PLATFORM}}</dd>
              </div>
            </div>
          </dl>
        </section>

        <section class="description-section" aria-label="Project detail sections">
          <div class="description-flow">
            {{DESCRIPTION_SECTIONS}}
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
